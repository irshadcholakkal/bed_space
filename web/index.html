<!DOCTYPE html>
<html lang="en">

<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Manage buildings, rooms, tenants, rent payments and expenses.">
  <meta name="theme-color" content="#ff385c">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Bed Space">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png" />

  <title>Bed Space Management</title>
  <link rel="manifest" href="manifest.json">
</head>

<body>
  <noscript>Enable JavaScript to use Bed Space Management.</noscript>
  <script>
    // Upgrade old hash-style app bookmarks before Flutter reads the URL.
    if (location.hash.startsWith('#/') && !location.hash.startsWith('#//')) {
      const base = new URL(document.baseURI);
      const route = new URL(location.hash.slice(2), base);
      if (route.origin === base.origin && route.pathname.startsWith(base.pathname)) {
        history.replaceState(history.state, '', route.href);
      }
    }
  </script>
  <script src="pwa.js" defer></script>
  <script src="flutter_bootstrap.js" async></script>
</body>

</html>
