[functions.create-paymob-checkout]
verify_jwt = false
# The handler validates the user's JWT through Supabase Auth (supports publishable keys).

[functions.paymob-webhook]
verify_jwt = false
# Paymob callbacks are authenticated by HMAC, not a Supabase user session.

[functions.refresh-google-session]
verify_jwt = false
# The handler validates the user's JWT with Supabase Auth before renewing Google access.
